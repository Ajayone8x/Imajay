<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Live</title>

  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.4/dist/shaka-player.ui.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.3.4/dist/controls.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-color: #000;
      --primary-red: #e50914;
      --primary-red-dark: #b91c1c;
      --accent-glow: rgba(255, 31, 31, 0.6);
      --card-bg: linear-gradient(145deg, #131313, #1f1f1f);
      --text-light: #e6e6e6;
      --text-muted: #9ca3af;
      --border-color: #2d2d2d;
      --popup-bg: #1b1b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: radial-gradient(circle at top, #0b0b0b, #000);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 1rem;
      animation: fadeInScene 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes fadeInScene {
      0% {
        opacity: 0;
        transform: scale(1.05);
        filter: blur(6px);
      }
      100% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
      }
    }

    .container {
      width: 100%;
      max-width: 850px;
      border: 2px solid rgba(229, 9, 20, 0.2);
      box-shadow: 0 0 30px rgba(229, 9, 20, 0.1);
      border-radius: 18px;
      backdrop-filter: blur(12px);
      padding-bottom: 2rem;
      animation: fadeUp 0.8s ease-out;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .stream-header {
      text-align: center;
      padding: 1.5rem 1rem;
      position: relative;
    }

    .stream-header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .stream-header::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 60%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary-red), transparent);
      transform: translateX(-50%);
      opacity: 0.7;
    }

    .live-badge {
      background-color: var(--primary-red);
      color: white;
      padding: 0.35rem 0.8rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      animation: pulse 1.5s infinite;
      margin-top: 8px;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(229, 9, 20, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 10px rgba(229, 9, 20, 0);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(229, 9, 20, 0);
      }
    }

    #player-container {
      width: 100%;
      height: 50vh;
      max-height: 600px;
      background-color: #000;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.2);
    }

    #player-container::after {
      content: "";
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 20px;
      background: radial-gradient(circle, var(--accent-glow), transparent);
      filter: blur(18px);
    }

    .info-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      text-align: center;
      margin: 1.2rem 1rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .info-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .info-card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--text-muted);
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.9rem 1.25rem;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--primary-red), var(--primary-red-dark));
      color: white;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .action-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px var(--accent-glow);
    }

    .action-button.copied {
      background: linear-gradient(90deg, #22c55e, #4ade80);
    }

    .back-link {
      display: inline-block;
      width: 100%;
      text-align: center;
      margin-top: 2rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.75rem;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }

    .back-link:hover {
      background-color: var(--card-bg);
      color: var(--text-light);
    }

    .error-message {
      text-align: center;
      padding: 4rem 1rem;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
    }

    .error-message h2 {
      color: var(--primary-red);
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    /* Telegram Popup */
    .telegram-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: var(--popup-bg);
      color: var(--text-light);
      padding: 30px 20px;
      border-radius: 12px;
      box-shadow: 0 0 50px 10px var(--accent-glow);
      z-index: 10000;
      text-align: center;
      width: 90%;
      max-width: 350px;
      display: none;
      border: 1px solid var(--primary-red-dark);
      animation: popIn 0.3s ease-out forwards;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.8);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .telegram-popup h2 {
      color: var(--primary-red);
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .telegram-popup p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .telegram-popup button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .telegram-popup .join-btn {
      background: linear-gradient(90deg, var(--primary-red), var(--primary-red-dark));
      color: white;
    }

    .telegram-popup .joined-btn {
      background-color: var(--border-color);
      color: var(--text-light);
    }

    @media (max-width: 480px) {
      body {
        padding: 0.5rem;
      }
      .container {
        border: none;
        box-shadow: none;
      }
      .stream-header h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
